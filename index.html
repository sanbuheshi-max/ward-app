var POSSEED = {};

}

    cards: SEED.map(function (s, i) { var sn = parseSenses(s[1], s[2]); if (sn.length === 1 && !sn[0].pos && POSSEED[s[0]]) sn[0].pos = POSSEED[s[0]]; var c = mkCard(s[0], sn, true, s[3]); c.created = t + i; return c; }) };
}

}

/* ---------- persistence ---------- */
var dbDoc = null, saving = false, dirty = false, timer = null;
function save() {
  S.updatedAt = Date.now();
  var keys = Object.keys(S.daily).sort(); while (keys.length > 90) delete S.daily[keys.shift()];
  try { var active = getDeck(); active.data = S; localStorage.setItem(LS, JSON.stringify({ v: 1, activeDeckId: activeDeckId, decks: decks })); } catch (e) {}
  dirty = true; clearTimeout(timer); timer = setTimeout(flush, 800);
}
function flush() {
  if (!dbDoc || !dirty) return;
  if (saving) { timer = setTimeout(flush, 500); return; }
  var json = JSON.stringify(S);
  if (json.length > 240000) { ui.sync = 'full'; renderSync(); return; }
  saving = true; dirty = false;
  dbDoc.set({ json: json, updatedAt: S.updatedAt }).then(function () { ui.sync = 'ok'; }).catch(function () { ui.sync = 'err'; dirty = true; }).then(function () { saving = false; renderSync(); });
}
function renderSync() {
  var el = document.getElementById('sync'), t = document.getElementById('synct');
  var m = { local: ['', 'この端末'], ok: ['ok', '保存済み'], err: ['err', '同期エラー'], full: ['err', '容量オーバー'] }[ui.sync] || ['', ''];
  el.className = 'sync ' + m[0]; t.textContent = m[1];
}
async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    var user = await window.claude.use('user'), db = await window.claude.use('db');
    if (!user || !db) return;
    var id = await user.id(); if (!id) return;
    dbDoc = db.doc('data/users/' + id + '/app');
    var snap = await dbDoc.get();
    if (snap.exists) {
      var remote = migrate(JSON.parse(snap.data().json));
      if (remote.updatedAt > S.updatedAt) {
        S = remote; try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
        if (ui.done === 0) ui.queue = buildQueue();
        render();
      } else if (S.updatedAt > remote.updatedAt) { dirty = true; flush(); }
    } else if (S.updatedAt > 0) { dirty = true; flush(); }
    ui.sync = 'ok'; renderSync();
  } catch (e) { ui.sync = 'local'; renderSync(); }
}

/* ---------- queue ---------- */
function buildQueue() {
  var now = Date.now();
  var due = S.cards.filter(function (c) { return c.state !== 'new' && c.due <= now; }).sort(function (a, b) { return a.due - b.due; });
  var news = S.cards.filter(function (c) { return c.state === 'new'; }).sort(function (a, b) { return a.created - b.created; }).slice(0, newLeft());
  return due.concat(news).map(function (c) { return c.id; });
}
function cur() { while (ui.queue.length) { var c = find(ui.queue[0]); if (c) return c; ui.queue.shift(); } return null; }
function resetCardUI() { ui.flipped = false; ui.forced = 0; ui.ans = null; ui.q = null; ui.spellText = ''; ui.hint = 0; }
function applyRating(c, r) {
  var now = Date.now(), d = ensureDay();
  if (c.state === 'new') d.newDone++;
  d.reviews++; if (r >= 3) d.correct++;
  var s = schedule(c, r, now); c.state = s.state; c.ivl = s.ivl; c.ease = s.ease; c.lapses = s.lapses; c.due = s.due;
  c.reps = (c.reps || 0) + 1; c.last = now; ui.done++; save();
}
function advance() {
  var id = ui.queue.shift(), c = find(id);
  if (c && c.state === 'learn') ui.queue.splice(Math.min(4, ui.queue.length), 0, id);
  resetCardUI(); render();
}
function commit(r) { var c = cur(); if (!c) return; applyRating(c, r); advance(); }
function answer(r) { var c = cur(); if (!c || ui.ans) return; applyRating(c, r); ui.ans = { r: r }; }

  }).join('') + (cs.length > 300 ? '<p class="note">先頭300件を表示しています。検索で絞り込めます。</p>' : '') + '</div>';
}
function viewWords() {
  var hasSample = S.cards.some(function (c) { return c.sample; });
  return '<div class="panel"><h2>単語帳 · ' + esc(getDeck().name) + ' (' + (getDeck().lang === 'fi' ? 'フィンランド語' : '英語') + ')</h2><p class="note">右上のメニューで単語帳を切り替えたり、新しい単語帳を作成できます。</p></div><div class="panel"><h2>単語を追加</h2><input id="a-en" class="field" placeholder="単語" autocapitalize="none" autocomplete="off"><div class="btnrow">' + CHARS('a-en') + '</div><div id="a-senses" class="senses-ed">' + senseRow({}) + '</div><button class="btn sm" data-act="addsense" data-target="a-senses">＋ 意味を追加(品詞ごと)</button><input id="a-note" class="field" placeholder="活用・メモ(任意) 例: talon, taloa"><button class="btn primary" data-act="add">追加</button></div>' +
    '<div class="panel"><details><summary>まとめて追加</summary><div style="display:grid;gap:10px;margin-top:10px"><textarea id="bulk" class="field" placeholder="1行1語。フィンランド語, 意味, 例文(任意)&#10;例: talo, 名:家, Meillä on talo."></textarea><button class="btn" data-act="bulk">取り込む</button><p class="note">カンマまたはタブ区切り。意味が複数あるときは「；」で区切り、品詞は「動:」「名:」のように意味の前につけます。タブ区切りなら4列目に活用などのメモを入れられます。</p></div></details></div>' +
    '<div class="panel" style="gap:8px"><h2>単語一覧 · ' + S.cards.length + '語</h2><input id="search" class="field" type="search" placeholder="検索" value="' + esc(ui.search) + '"><div id="wlist">' + listHTML() + '</div></div>' +
    (hasSample ? '<button class="btn danger sm" data-act="delsample">サンプル単語をすべて削除</button>' : '');
}
function viewLog() {
  var now = Date.now(), cs = S.cards;
  var nNew = 0, nLearn = 0, nYoung = 0, nMature = 0;
  cs.forEach(function (c) { if (c.state === 'new') nNew++; else if (c.state === 'learn') nLearn++; else if (c.ivl >= 21) nMature++; else nYoung++; });
  var tot = Math.max(1, cs.length), d = today();
  var streak = 0, t = now; if (!(S.daily[dkey(t)] && S.daily[dkey(t)].reviews > 0)) t -= DAY;
  while (S.daily[dkey(t)] && S.daily[dkey(t)].reviews > 0) { streak++; t -= DAY; }
  var days = [], max = 1;
  for (var i = 6; i >= 0; i--) { var tt = now - i * DAY, v = (S.daily[dkey(tt)] || {}).reviews || 0; days.push({ v: v, l: new Date(tt).toLocaleDateString('ja-JP', { weekday: 'short' }) }); if (v > max) max = v; }
  var h = '<div class="tiles"><div class="tile"><span>今日</span><b>' + d.reviews + '</b></div><div class="tile"><span>正答率</span><b>' + (d.reviews ? Math.round(d.correct / d.reviews * 100) + '%' : '-') + '</b></div><div class="tile"><span>連続日数</span><b>' + streak + '</b></div></div>';
  h += '<div class="panel" style="margin-top:14px"><h2>直近7日の回答数</h2><div class="bars">' + days.map(function (x) { return '<div class="bar"><b>' + (x.v || '') + '</b><i class="' + (x.v ? '' : 'zero') + '" style="height:' + Math.max(3, Math.round(x.v / max * 80)) + 'px"></i><span>' + x.l + '</span></div>'; }).join('') + '</div></div>';
  h += '<div class="panel"><h2>定着度 · ' + cs.length + '語</h2><div class="stack"><i style="width:' + nMature / tot * 100 + '%;background:var(--good)"></i><i style="width:' + nYoung / tot * 100 + '%;background:var(--easy)"></i><i style="width:' + nLearn / tot * 100 + '%;background:var(--hard)"></i></div><div class="legend"><span>定着(21日以上) <b>' + nMature + '</b></span><span>復習中 <b>' + nYoung + '</b></span><span>学習中 <b>' + nLearn + '</b></span><span>未学習 <b>' + nNew + '</b></span></div></div>';
  h += '<div class="panel"><h2>設定</h2><div class="set"><span>1日の新しい単語</span><div class="stepper"><button class="btn sm" data-act="npd" data-d="-5" aria-label="減らす">−</button><b>' + S.settings.newPerDay + '</b><button class="btn sm" data-act="npd" data-d="5" aria-label="増やす">＋</button></div></div>' +
    '<label class="set"><span>カード表示時に自動で発音</span><input id="auto" type="checkbox"' + (S.settings.auto ? ' checked' : '') + '></label></div>';
  h += '<div class="panel"><h2>データ</h2><div class="btnrow"><button class="btn sm" data-act="export-anki">Anki用に書き出し</button><button class="btn sm" data-act="export-json">バックアップ</button><label class="btn sm" for="restore">復元</label><input id="restore" type="file" accept=".json,application/json" hidden></div>' +
    (ui.exportText ? '<textarea class="field" readonly id="exp">' + esc(ui.exportText) + '</textarea>' : '') +
    '<p class="note">Anki用は「フィンランド語・意味・例文・メモ」のタブ区切りテキストです。AnkiDroid の「ファイルから取り込み」で読み込めます。</p>' +
    '<button class="btn danger sm" data-act="resetprog">' + (ui.confirm === 'reset' ? '本当にリセットする(もう一度タップ)' : '学習の進み具合をリセット') + '</button></div>';
  return h;
}
var TABICON = {
  study: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 12h8"/></svg>',
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 12h14M5 19h9"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
function render() {
  var ds = $('#deck-select'); if (ds) ds.innerHTML = decks.map(function (d) { return '<option value="' + esc(d.id) + '"' + (d.id === activeDeckId ? ' selected' : '') + '> ' + esc(d.name) + '</option>'; }).join('');
  $('#tabs').innerHTML = [['study', '学習'], ['words', '単語'], ['log', '記録']].map(function (t) { return '<button data-act="tab" data-tab="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + TABICON[t[0]] + t[1] + '</button>'; }).join('');
  var v = $('#view');
  v.innerHTML = ui.tab === 'study' ? viewStudy() : ui.tab === 'words' ? viewWords() : viewLog();
  if (ui.tab === 'study') {
    var c = cur();
    if (c && S.settings.mode === 'spell' && !ui.ans) { var sp = $('#sp'); if (sp) sp.focus({ preventScroll: true }); }
    if (c && S.settings.auto && S.settings.mode !== 'spell' && ui.spoken !== c.id) { ui.spoken = c.id; speak(c.en); }
    if (c && S.settings.mode === 'spell' && ui.ans && ui.spoken !== c.id) { ui.spoken = c.id; if (S.settings.auto) speak(c.en); }
    if (c && S.settings.mode === 'card') bindSwipe();

}
function renderSheet() {
  var s = $('#sheet');
  if (!ui.edit) { s.innerHTML = ''; return; }
  var c = find(ui.edit); if (!c) { ui.edit = null; s.innerHTML = ''; return; }
  s.innerHTML = '<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-label="単語を編集"><h2>単語を編集</h2><input id="e-en" class="field" value="' + esc(c.en) + '" autocapitalize="none"><div class="btnrow">' + CHARS('e-en') + '</div><div id="e-senses" class="senses-ed">' + c.senses.map(function (s) { return senseRow(s); }).join('') + '</div><button class="btn sm" data-act="addsense" data-target="e-senses">＋ 意味を追加(品詞ごと)</button><input id="e-note" class="field" placeholder="活用・メモ(任意)" value="' + esc(c.note || '') + '"><p class="note">状態: ' + stLabel(c) + ' · 間隔 ' + (c.ivl || 0) + '日 · 回答 ' + (c.reps || 0) + '回 · 失敗 ' + (c.lapses || 0) + '回</p><div class="btnrow"><button class="btn primary" data-act="saveedit">保存</button><button class="btn" data-act="resetcard">この単語を未学習に戻す</button><button class="btn danger" data-act="delcard">' + (ui.confirm === 'del' ? '本当に削除(もう一度タップ)' : '削除') + '</button></div></div></div>';
}

/* ---------- swipe ---------- */
function bindSwipe() {
  var el = $('#fc'); if (!el) return;
  var x0 = null, dx = 0, id = null;
  el.addEventListener('pointerdown', function (e) { if (e.target.closest('button')) return; x0 = e.clientX; dx = 0; id = e.pointerId; try { el.setPointerCapture(id); } catch (er) {} el.style.transition = 'none'; });
  el.addEventListener('pointermove', function (e) { if (x0 == null) return; dx = e.clientX - x0; el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 40 + 'deg)'; });
  function end() {
    if (x0 == null) return; var d = dx; x0 = null; el.style.transition = '';
    if (Math.abs(d) < 8) { el.style.transform = ''; if (!ui.flipped) { ui.flipped = true; render(); } return; }
    if (Math.abs(d) < 90) { el.style.transform = ''; return; }
    var right = d > 0;
    if (ui.forced) { if (right) { el.style.transform = ''; return; } fly(el, -1, function () { commit(1); }); return; }
    if (!ui.flipped) {
      if (right) fly(el, 1, function () { commit(4); });
      else { el.style.transform = ''; ui.flipped = true; ui.forced = 1; render(); }
    } else fly(el, right ? 1 : -1, function () { commit(right ? 3 : 1); });
  }
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function fly(el, dir, done) { el.style.transform = 'translateX(' + dir * 520 + 'px) rotate(' + dir * 12 + 'deg)'; el.style.opacity = '0'; setTimeout(done, 150); }

/* ---------- actions ---------- */
function norm(s) { return s.trim().toLowerCase().replace(/\s+/g, ' '); }
function fl(s) { return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function check(giveup) {
  var c = cur(); if (!c || ui.ans) return;
  var inp = $('#sp'), val = inp ? inp.value : '';
  ui.spellText = val;
  if (giveup) { answer(1); ui.ans.gave = true; render(); return; }
  if (!norm(val)) return;
  var ok = c.en.split('/').some(function (a) { return norm(a) === norm(val); });
  var fold = !ok && c.en.split('/').some(function (a) { return fl(a) === fl(val); });
  answer(ok ? (ui.hint ? 2 : 3) : fold ? 2 : 1); ui.ans.ok = ok; ui.ans.fold = fold; render();
}
function addCards(list) {
  var have = {}; S.cards.forEach(function (c) { have[c.en.toLowerCase()] = 1; });
  var added = 0, skipped = 0, t = Date.now();
  list.forEach(function (x) {
    if (!x.en || !x.senses || !x.senses.length) return;
    if (have[x.en.toLowerCase()]) { skipped++; return; }
    var c = mkCard(x.en, x.senses, false, x.note); c.created = t + added; S.cards.push(c); have[x.en.toLowerCase()] = 1; added++;
  });
  if (added) save(); return { added: added, skipped: skipped };
}
async function exportFile(name, text) {
  ui.exportText = '';
  try {
    var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: text }); toast('保存しました'); render(); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  ui.exportText = text; render(); toast('下の欄からコピーしてください');
}
function restore(file) {
  var r = new FileReader();
  r.onload = function () {
    try { var d = migrate(JSON.parse(r.result)); if (!Array.isArray(d.cards)) throw 0; S = d; save(); ui.queue = buildQueue(); ui.done = 0; resetCardUI(); render(); toast('復元しました'); }
    catch (e) { toast('読み込めないファイルです'); }
  };
  r.readAsText(file);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'create-deck') { var lang = window.prompt('言語を選んでください: fi = フィンランド語 / en = 英語', 'en'); if (lang == null) return; lang = lang.trim().toLowerCase(); if (lang !== 'fi' && lang !== 'en') { toast('fi または en を入力してください'); return; } var name = window.prompt('単語帳の名前', lang === 'fi' ? 'フィンランド語' : '英語'); if (!name || !name.trim()) return; var d = { id: uid(), name: name.trim(), lang: lang, data: makeState([], lang) }; decks.push(d); activeDeckId = d.id; S = d.data; save(); ui.search = ''; ui.queue = buildQueue(); ui.done = 0; resetCardUI(); render(); toast('単語帳を作成しました'); return; }
  if (a === 'delete-deck') { if (decks.length < 2) { toast('最後の単語帳は削除できません'); return; } if (!window.confirm('「' + getDeck().name + '」を削除しますか？単語と学習記録も削除されます。')) return; decks = decks.filter(function (d) { return d.id !== activeDeckId; }); activeDeckId = decks[0].id; S = getDeck().data; save(); ui.queue = buildQueue(); ui.done = 0; resetCardUI(); render(); return; }
  if (a === 'closesheet') { if (e.target === b) { ui.edit = null; ui.confirm = ''; renderSheet(); } return; }
  if (a === 'tab') { ui.tab = b.dataset.tab; ui.confirm = ''; ui.exportText = ''; render(); window.scrollTo(0, 0); return; }
  if (a === 'mode') { S.settings.mode = b.dataset.mode; save(); resetCardUI(); render(); return; }
  if (a === 'speak') { var c = cur(); if (c) speak(c.en); return; }
  if (a === 'flip') { ui.flipped = true; render(); return; }
  if (a === 'rate') { commit(+b.dataset.r); return; }
  if (a === 'pick') {
    var c2 = cur(); if (!c2 || ui.ans) return; ui.q.pick = +b.dataset.i;
    answer(ui.q.opts[ui.q.pick] === meaningStr(c2) ? 3 : 1); render(); return;
  }
  if (a === 'next') { advance(); return; }
  if (a === 'check') { check(false); return; }
  if (a === 'giveup') { check(true); return; }
  if (a === 'hint') { var cc = cur(); var inp = $('#sp'); if (inp) ui.spellText = inp.value; if (cc && ui.hint < cc.en.length - 1) ui.hint++; render(); return; }
  if (a === 'more') { ensureDay().extra += 10; save(); ui.queue = buildQueue(); resetCardUI(); render(); return; }
  if (a === 'add') {
    var en = $('#a-en').value.trim(), sn = collectSenses($('#a-senses'));
    if (!en || !sn.length) { toast('フィンランド語と意味を入力してください'); return; }
    var r = addCards([{ en: en, senses: sn, note: $('#a-note').value.trim() }]);
    if (!r.added) { toast('すでに登録されています。一覧から開いて意味を追加できます'); return; }
    if (ui.done === 0) ui.queue = buildQueue();
    render(); toast('追加しました'); setTimeout(function () { var f = $('#a-en'); if (f) f.focus({ preventScroll: true }); }, 0); return;
  }
  if (a === 'bulk') {
    var list = parseBulk($('#bulk').value);
    if (!list.length) { toast('読み取れる行がありません'); return; }
    var r2 = addCards(list); if (ui.done === 0) ui.queue = buildQueue(); render();
    toast(r2.added + '語を追加' + (r2.skipped ? '(重複' + r2.skipped + '語は除外)' : '')); return;
  }
  if (a === 'ins') {
    var el = document.getElementById(b.dataset.target); if (!el) return;
    var si = el.selectionStart == null ? el.value.length : el.selectionStart, ei = el.selectionEnd == null ? si : el.selectionEnd;
    el.value = el.value.slice(0, si) + b.dataset.ch + el.value.slice(ei); el.focus(); el.setSelectionRange(si + 1, si + 1); return;
  }
  if (a === 'addsense') {
    var box = document.getElementById(b.dataset.target); box.insertAdjacentHTML('beforeend', senseRow({}));
    var nj = box.lastElementChild.querySelector('.s-ja'); if (nj) nj.focus({ preventScroll: false }); return;
  }
  if (a === 'delsense') {
    var row = b.closest('.sense-row'), bx = row.parentElement;
    if (bx.children.length > 1) row.remove(); else { row.querySelector('.s-ja').value = ''; row.querySelector('.s-ex').value = ''; row.querySelector('.pos-sel').value = ''; }
    return;
  }
  if (a === 'edit') { ui.edit = b.dataset.id; ui.confirm = ''; renderSheet(); return; }
  if (a === 'saveedit') {
    var ce = find(ui.edit); if (!ce) return;
    var ne = $('#e-en').value.trim(), ns = collectSenses($('#e-senses'));
    if (!ne || !ns.length) { toast('フィンランド語と意味は必須です'); return; }
    ce.en = ne; ce.senses = ns; ce.note = $('#e-note').value.trim(); ce.sample = false; save(); ui.edit = null; render(); toast('保存しました'); return;
  }
  if (a === 'resetcard') { var cr = find(ui.edit); if (cr) { cr.state = 'new'; cr.ivl = 0; cr.ease = 2.5; cr.due = 0; cr.reps = 0; cr.lapses = 0; save(); ui.edit = null; ui.queue = buildQueue(); resetCardUI(); render(); toast('未学習に戻しました'); } return; }
  if (a === 'delcard') {
    if (ui.confirm !== 'del') { ui.confirm = 'del'; renderSheet(); return; }
    S.cards = S.cards.filter(function (c) { return c.id !== ui.edit; }); ui.queue = ui.queue.filter(function (id) { return id !== ui.edit; });
    ui.edit = null; ui.confirm = ''; save(); render(); toast('削除しました'); return;
  }
  if (a === 'delsample') { S.cards = S.cards.filter(function (c) { return !c.sample; }); save(); ui.queue = buildQueue(); resetCardUI(); render(); toast('サンプルを削除しました'); return; }
  if (a === 'npd') { S.settings.newPerDay = Math.min(100, Math.max(5, S.settings.newPerDay + (+b.dataset.d))); save(); render(); return; }

  if (a === 'export-json') { exportFile('sanat-backup.json', JSON.stringify(S)); return; }

    S.cards.forEach(function (c) { c.state = 'new'; c.ivl = 0; c.ease = 2.5; c.due = 0; c.reps = 0; c.lapses = 0; }); S.daily = {};
    ui.confirm = ''; save(); ui.queue = buildQueue(); ui.done = 0; resetCardUI(); render(); toast('リセットしました'); return;
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'search') { ui.search = e.target.value; $('#wlist').innerHTML = listHTML(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'deck-select') { var next = decks.find(function (d) { return d.id === e.target.value; }); if (next) { var old = getDeck(); old.data = S; activeDeckId = next.id; S = next.data; ui.search = ''; ui.exportText = ''; ui.edit = null; ui.queue = buildQueue(); ui.done = 0; resetCardUI(); render(); window.scrollTo(0, 0); } return; }
  if (e.target.id === 'auto') { S.settings.auto = e.target.checked; save(); }
  if (e.target.id === 'restore' && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener('keydown', function (e) {
  var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.key === 'Enter' && t && t.id === 'sp') { e.preventDefault(); check(false); return; }
  if (e.key === 'Enter' && t && (t.id === 'a-en' || (t.closest && t.closest('#a-senses') && t.tagName === 'INPUT'))) { e.preventDefault(); var ab = $('[data-act="add"]'); if (ab) ab.click(); return; }
  if (typing || ui.tab !== 'study' || ui.edit) return;
  var c = cur(); if (!c) return;
  var mode = S.settings.mode;
  if (mode === 'card') {
    if (!ui.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ui.flipped = true; render(); }
    else if (ui.flipped && ui.forced && (e.key === ' ' || e.key === 'Enter' || e.key === '1')) { e.preventDefault(); commit(1); }
    else if (ui.flipped && '1234'.indexOf(e.key) >= 0 && e.key) commit(+e.key);
  } else if (mode === 'quiz') {
    if (!ui.ans && '1234'.indexOf(e.key) >= 0 && e.key && ui.q) { var b = $('[data-act="pick"][data-i="' + (+e.key - 1) + '"]'); if (b) b.click(); }
    else if (ui.ans && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
  } else if (mode === 'spell' && ui.ans && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
});

ui.queue = buildQueue();
render();

})();
